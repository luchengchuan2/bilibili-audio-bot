name: bilibili-test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: install
        run: |
          pip install yt-dlp
          sudo apt update
          sudo apt install -y ffmpeg

      - name: write list
        run: |
          cat > list.txt << 'EOF'
          BV187Msz4Ebg
          BV1d4411N7zD
          EOF

      - name: download
        run: |
          while read bv; do
            echo "Processing $bv"
            yt-dlp "https://www.bilibili.com/video/$bv" \
            -f bestaudio \
            --extract-audio \
            --audio-format mp3 \
            --write-subs \
            --write-auto-subs \
            --convert-subs srt || true
          done < list.txt

      - name: make video
        run: |
          for f in *.mp3; do
            echo "Making video for $f"
            sub=$(ls "${f%.mp3}".*.srt 2>/dev/null | head -n 1)
            if [ -f "$sub" ]; then
              ffmpeg -f lavfi -i color=c=black:s=1280x720 \
              -i "$f" -shortest \
              -vf "subtitles=$sub:force_style='Fontsize=36,Alignment=10,Outline=3'" \
              -c:v libx264 -c:a aac -b:a 192k \
              "${f%.mp3}.mp4"
            else
              echo "No subtitle for $f"
            fi
          done

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: result-test
          path: |
            *.mp4
            *.mp3
            *.srt
