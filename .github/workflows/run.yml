name: bilibili-bv

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 安装工具
        run: |
          pip install yt-dlp
          sudo apt update
          sudo apt install -y ffmpeg

      - name: 写入BV列表
