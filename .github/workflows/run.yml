          BV1DzeEzMEEM
          BV1sMcdzEEVb
          BV1pt7AzkE9H
          BV1T7411c7Z7
          BV19A6ZYtECF
          EOF

      - name: 下载音频+字幕
        run: |
          while read bv; do
            yt-dlp "https://www.bilibili.com/video/$bv" \
            -f bestaudio \
            --extract-audio \
            --audio-format mp3 \
            --write-subs \
            --write-auto-subs \
            --sub-lang zh-CN \
            --convert-subs srt || true
          done < list.txt

      - name: 生成黑屏视频（字幕居中+放大）
        run: |
          for f in *.mp3; do
            sub="${f%.mp3}.zh-CN.srt"
            if [ -f "$sub" ]; then
              ffmpeg -f lavfi -i color=c=black:s=1280x720 \
              -i "$f" -shortest \
              -vf "subtitles=$sub:force_style='Fontsize=36,Alignment=10,Outline=3'" \
              -c:v libx264 -c:a aac -b:a 192k \
              "${f%.mp3}.mp4"
            fi
          done

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: "*.mp4"
